[/Script/UnrealEd.ProjectPackagingSettings]
; Android: loose (NonUFS) files sit in the APK where the engine can't list them, so the web UI copy-out
; (ZoogiWebUI.cpp WebUIUrl) found nothing and the WebView showed "Webpage not available". In the pak it can.
-DirectoriesToAlwaysStageAsNonUFS=(Path="ZoogiUI")
+DirectoriesToAlwaysStageAsUFS=(Path="ZoogiUI")
