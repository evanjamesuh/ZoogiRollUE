[/Script/UnrealEd.ProjectPackagingSettings]
; Android: loose (NonUFS) files sit in the APK where the engine can't list them, so the web UI copy-out
; (ZoogiWebUI.cpp WebUIUrl) found nothing and the WebView showed "Webpage not available". In the pak it can.
-DirectoriesToAlwaysStageAsNonUFS=(Path="ZoogiUI")
+DirectoriesToAlwaysStageAsUFS=(Path="ZoogiUI")
; Oct 22 (Evan): Fab packs - heavy nebula skyboxes + VDB never cook for Android.
; Approved 8 packs stay available on Win64/PC cooks; mobile must skip nebula heavies.
; Paths match ZoogiRollUnreal-fab Content/ and ZoogiFabAssets Content/ when migrated.
+DirectoriesToNeverCook=(Path="/Game/Animated_Nebulas_Starter_Pack")
+DirectoriesToNeverCook=(Path="/Game/Nebula_VDB")
; Mountain Tops source pack (Iceland_Environment). Mobile uses Content/Env/Arenas/FrozenMountains only.
+DirectoriesToNeverCook=(Path="/Game/Iceland_Environment")
; Fab showcase / demo / example maps - never cook into Android APK
+DirectoriesToNeverCook=(Path="/Game/ArrowTrail/Demo")
+DirectoriesToNeverCook=(Path="/Game/ArrowTrail/Map")
+DirectoriesToNeverCook=(Path="/Game/Fluid_Orbs/Map")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Easy_Impact_Frames/Demo")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Easy_Shockwaves_VFX/Demo")
+DirectoriesToNeverCook=(Path="/Game/Animated_Nebulas_Starter_Pack/Maps")
+DirectoriesToNeverCook=(Path="/Game/Nebula_VDB/Maps")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Easy_Impact_Frames/Maps")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Easy_Shockwaves_VFX/Maps")

